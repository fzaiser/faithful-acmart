# Central test manifest — drives the regression gates (`make check`) and the
# diff/reference resolution. One [tests.NAME] entry per test stem.
#
#   kind          "twin"          matched .tex/.typ pair; compared against
#                                 tests/out/latex/<reference>.pdf
#                 "upstream-ref"  Typst-only port; compared against the upstream
#                                 reference PDF named by `reference`
#   reference     LaTeX stem to compare/diff against (defaults to the test name)
#   pages         expected Typst page count (Tier 0)
#   page_parity   require LaTeX page count == Typst page count (Tier 0).
#                 Default true for twins, false for upstream-ref.
#   metrics       false to skip Tier 2 layout metrics for this test
#   page1_only    Tier 2: gate absolute vertical positions on page 1 only
#                 (multi-page docs drift downward via acmsmall's \flushbottom,
#                 which Typst can't replicate — see CLAUDE.md)
#
# typst_version pins the engine the Tier 1 goldens were captured with; bumping
# Typst means regenerating them (`make accept`).
typst_version = "0.14.2"

# Tier 2 gate tolerances (PDF points; both engines emit 1/72in big points).
# Only robust, renderer-agnostic invariants are gated. Right margin and line
# count depend on cross-engine line-breaking, so metrics.py reports them but does
# not gate on them. See tools/metrics.py for the rationale.
[metrics_tolerance]
left = 1.0    # text-block left edge — true horizontal invariant, gated tightly
top = 4.5     # first-content vertical position — loose: absorbs glyph-bbox
              # ascent conventions and title-page variance, still catches gross shifts
pitch = 0.6   # baseline-to-baseline pitch — gated only on uniform_pitch tests

# uniform_pitch = true marks tests whose body is set on a single baseline grid,
# so median baseline pitch is meaningful and gated. Mixed-leading documents
# (captions, theorems, lists, title block) leave it off — pitch is reported only.

[tests.body-test]
kind = "twin"
pages = 1
uniform_pitch = true

[tests.head-test]
kind = "twin"
pages = 1
uniform_pitch = true

[tests.body2-test]
kind = "twin"
pages = 1

[tests.fn-test]
kind = "twin"
pages = 1

[tests.full-test]
kind = "twin"
pages = 2
page1_only = true
uniform_pitch = true

[tests.title-test]
kind = "twin"
pages = 1

[tests.manuscript-test]
kind = "twin"
pages = 1
# format=manuscript: single-column draft geometry (letterpaper, 9pt default) with
# the generic sans-bold section fonts shared with acmsmall.

[tests.acmlarge-test]
kind = "twin"
pages = 1
# format=acmlarge: large single-column journal geometry (10pt) with the
# \sffamily\large (regular-weight) section headings (acmart.dtx:8424).

[tests.acmtog-test]
kind = "twin"
pages = 1
page1_only = true
# format=acmtog: two-column JOURNAL. Spanning left @i title + author list,
# contact-info footnote + ACM bibstrip + journal footer (journal/tog top matter in
# two columns), 9pt parindent, sans-large sections.

[tests.sigconf-test]
kind = "twin"
pages = 1
page1_only = true
# format=sigconf: two-column proceedings. Spanning centered title + author grid,
# first-column copyright block, serif-bold Large sections. Two columns of
# justified text break differently across engines (higher pixel mismatch is
# expected); page1_only gates absolute positions on the title page only.

[tests.sigconf-authors-test]
kind = "twin"
pages = 1
page1_only = true
# Conference author grid with a PARTIAL last row (5 groups at 3-per-row => 3 + 2).
# Guards make-authors-grid's per-row centering: the final row of 2 is centered, not
# left-aligned (validated against LaTeX, which centers every row).

[tests.sigplan-test]
kind = "twin"
pages = 1
metrics = false
# format=sigplan: sigconf variant — serif-bold Huge title (no sans), 10pt, 1in/
# 0.75in margins, serif-bold sections, sans URLs. Validated by the LaTeX overlay
# (geometry/left-edge match). Tier 2 top-position is report-only here: our Huge
# *serif* title pins its cap-top to the margin (the faithful \topskip model, as
# for acmsmall), but topmost-ink then differs from LaTeX's baseline placement by
# ~5pt of glyph-bbox overshoot — just over the loose top tolerance.

[tests.siggraph-test]
kind = "smoke"
pages = 1
page_parity = false
metrics = false
# format=siggraph: sigconf variant (normalsize serif authors, sans-bold Large
# sections). Typst-only golden-smoke (shares the sigconf two-column path).

[tests.sigchi-test]
kind = "smoke"
pages = 1
page_parity = false
metrics = false
# format=sigchi: sigconf variant — secnumdepth=1 (subsections unnumbered), bold
# serif author names. Typst-only golden-smoke.

[tests.acmengage-test]
kind = "smoke"
pages = 1
page_parity = false
metrics = false
# format=acmengage: sigconf variant (10pt, booktitle copyright line). Typst-only
# golden-smoke.

[tests.acmcp-test]
kind = "smoke"
pages = 1
page_parity = false
metrics = false
# format=acmcp: ACM cover page (best-effort). Single-column, unnumbered sections
# (secnumdepth -1), ACM reference format off. The JDS cover infobox (logo/frame)
# is not reproduced. Typst-only golden-smoke.

[tests.sigchi-a-test]
kind = "smoke"
pages = 2
page_parity = false
metrics = false
# format=sigchi-a: landscape SIGCHI extended abstracts (best-effort). Sans default,
# wide left margin, 2pt-rule title, unnumbered sections. Footnotes-in-margin and
# the legacy watermark are not reproduced. Typst-only golden-smoke.

[tests.fontsize-8-test]
kind = "twin"
pages = 1
uniform_pitch = true
# Base font-size option `8pt`: amsart \@typesizes ladder + baselineskip-derived
# heading/skip scaling. Body is on one grid, so pitch is gated.

[tests.fontsize-9-test]
kind = "twin"
pages = 1
uniform_pitch = true
# Base font-size option `9pt`.

[tests.fontsize-11-test]
kind = "twin"
pages = 1
uniform_pitch = true
# Base font-size option `11pt`.

[tests.fontsize-12-test]
kind = "twin"
pages = 1
uniform_pitch = true
# Base font-size option `12pt`.

[tests.bib-test]
kind = "twin"
pages = 1
uniform_pitch = true
# NB: the ACM CSL and ACM-Reference-Format.bst differ in *content* (dropped
# access dates, "Doctoral dissertation" vs "Ph.D.", doi: vs https://doi.org/,
# in-text range collapsing), so the reference list reflows — which is why line
# count is reported, not gated. Margins/pitch are still held to the same bar.

[tests.notes-test]
kind = "twin"
pages = 1
# Title/subtitle/author notes, corresponding mark, received line, and acks. The
# title block and footnote stack mix leadings, so pitch is reported, not gated.

[tests.options-test]
kind = "twin"
pages = 2
page1_only = true
# Toggles nonacm / printccs=false / printfolios=false plus the single-column
# no-ops balance=false / natbib=false. Two pages so page 2 shows the suppressed
# folios in the running head. Title block + footnote stack mix leadings (title,
# abstract, contact line), so pitch is reported, not gated.

[tests.authorversion-test]
kind = "twin"
pages = 1
# author-version copyright block (suppressed permission text + "author's version
# ... Version of Record" notice). Title block + footnote stack mix leadings, so
# pitch is reported, not gated.

[tests.language-test]
kind = "twin"
pages = 1
# Multilingual paper (acmart `language` option): French main language with
# English translated title/abstract/keywords. Verifies the localized fixed
# strings (keywordsname/acksname/proofname) and French hyphenation. Title block +
# footnote stack mix leadings, so pitch is reported, not gated.

[tests.language-de-test]
kind = "twin"
pages = 1
# German `language=german`: keywordsname/acksname/proofname + tablename
# ("Tabelle") localized, figure label still "Fig." Mixed leadings -> pitch
# reported, not gated.

[tests.language-es-test]
kind = "twin"
pages = 1
# Spanish `language=spanish`: keywordsname/acksname/proofname + tablename
# ("Cuadro") localized, figure label still "Fig." Mixed leadings -> pitch
# reported, not gated.

[tests.draft-test]
kind = "smoke"
pages = 1
page_parity = false
metrics = false
golden = false
# author-draft / timestamp mode. The timestamp footer embeds the compile date
# (datetime.today), so the output is non-deterministic — compile-only (Tier 0):
# no golden hash, no geometry gate, no LaTeX twin.

[tests.urlbreak-test]
kind = "smoke"
pages = 1
page_parity = false
metrics = false
# `urlbreakonhyphens: false`. Not a twin — LaTeX and Typst pick different URL
# break points, so only the Typst output is pinned (golden) to prove the long
# hyphenated URL no longer breaks at its hyphens. Deterministic, so golden-hashed.

[tests.feature-test]
kind = "smoke"
pages = 1
page_parity = false
metrics = false
# No LaTeX twin: badges/teaser use synthetic shapes. Compiled (warning-free) and
# golden-hashed only, to guard the title-note/subtitle-note/teaser/badges paths
# that notes-test (text-only) and the sample don't all exercise together.

[tests.sample-acmsmall]
kind = "upstream-ref"
reference = "acmsmall"
pages = 10
page_parity = false
page1_only = true
