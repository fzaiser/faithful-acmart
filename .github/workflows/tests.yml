name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PACKAGE_CHECK_REV: 50eb19311fde

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Restore pinned TeX Live
        uses: actions/cache@v6
        with:
          path: ~/.cache/faithful-acmart
          key: texlive-${{ runner.os }}-${{ hashFiles('tools/texlive.py') }}

      - name: Install pinned TeX Live
        run: uv run --frozen python tools/test.py texlive

      - name: Identify runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Restore Typst package checker
        id: package-check
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/typst-package-check
          key: typst-package-check-${{ steps.image.outputs.os }}-${{ env.PACKAGE_CHECK_REV }}

      - name: Install Typst package checker
        if: steps.package-check.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/typst/package-check --rev "$PACKAGE_CHECK_REV" --locked

      - name: Run regression suite
        run: uv run --frozen python tools/test.py check --jobs "$(nproc)"

  minimum-typst:
    name: Typst 0.14 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install minimum Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.0

      - name: Compile compatibility fixtures
        run: python3 tools/test.py min-version

  current-typst:
    name: Current Typst compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install latest Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: latest

      - name: Compile compatibility fixtures
        run: python3 tools/test.py compat
