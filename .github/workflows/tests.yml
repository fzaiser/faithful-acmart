name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # The texlive-lang-* packs supply the babel .ldf files and hyphenation
          # patterns for the twins that pass acmart's `language` option.
          sudo apt-get install -y --no-install-recommends \
            biber \
            texlive-bibtex-extra \
            texlive-extra-utils \
            texlive-fonts-extra \
            texlive-lang-french \
            texlive-lang-german \
            texlive-lang-spanish \
            texlive-latex-extra \
            texlive-publishers \
            texlive-science

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.2

      - name: Install uv
        # setup-uv publishes no floating major tag beyond v7; pin the release SHA.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Install Typst package checker
        run: cargo install --git https://github.com/typst/package-check --rev 50eb19311fde --locked

      - name: Run regression suite
        run: uv run --frozen python tools/test.py check

  minimum-typst:
    name: Typst 0.14 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install minimum Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.14.0

      - name: Compile compatibility fixtures
        run: python3 tools/test.py min-version
